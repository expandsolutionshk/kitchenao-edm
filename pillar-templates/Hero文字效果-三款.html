<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero 文字效果｜三款</title>
<style>
body{margin:0;background:#ECE8E0;font-family:-apple-system,"PingFang HK",sans-serif;color:#222}
.w0{max-width:1000px;margin:0 auto;padding:24px 18px 60px}h1{font-size:20px;margin:0 0 4px}.nt{font-size:13px;color:#777;margin:0 0 16px;line-height:1.7}
.op{margin:24px 0 0}.op h2{font-size:16px;margin:0 0 4px}.op p.d{font-size:13px;color:#666;margin:0 0 8px}
.st{position:relative;background:radial-gradient(120% 90% at 30% 40%,#1b1712 0%,#0b0b0b 60%);padding:40px 36px 44px;min-height:300px;color:#fff;overflow:hidden}
.rp{position:absolute;right:12px;top:12px;z-index:5;background:#222;color:#C8A24A;border:1px solid #C8A24A;font-size:12px;padding:5px 10px;cursor:pointer}
.k{font:700 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.38em;color:#C8A24A;animation:trk 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes trk{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.38em}}
.l{font-family:Baskerville,"Baskerville Old Face",Georgia,serif;font-style:italic;font-size:clamp(17px,2vw,22px);color:#EDE6D8;line-height:1.45;margin-top:14px}
.pr{display:inline-block;vertical-align:top;margin:0 22px 8px 0}.en,.zh{display:block}
.zh{font-family:"Songti TC","Noto Serif TC",serif;font-style:normal;font-size:13.5px;letter-spacing:.14em;color:#cfc7b8;margin-top:2px;min-height:1.4em}
.w2{font-size:1.55em;line-height:1.2}.w2 b,.zh b{font-weight:400;display:inline-block;letter-spacing:.06em;background:linear-gradient(100deg,#B8913A 20%,#F6E3A6 45%,#C8A24A 60%,#B8913A 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 3.2s 5s linear infinite}.zh b{font-size:1.15em;letter-spacing:.14em}@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}

/* ===== 最後出場：禮盒打開 → Open the Box! It’s Christmas! 從盒中升起 ===== */
.fin{display:flex;align-items:flex-end;gap:16px;margin:22px 0 0;min-height:64px}
.gb{position:relative;flex:none;width:52px;height:50px;opacity:0}
.gb .bx{position:absolute;left:3px;bottom:0;width:46px;height:32px;border:1.5px solid #C8A24A;background:linear-gradient(#17130d,#0d0b08)}
.gb .bx:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;background:#C8A24A}
.gb .lid{position:absolute;left:0;bottom:31px;width:52px;height:10px;border:1.5px solid #C8A24A;background:#15110b;transform-origin:2px 100%}
.gb .lid:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;background:#C8A24A}
.gb .lid:after{content:"";position:absolute;left:50%;top:-9px;width:14px;height:8px;margin-left:-7px;border:1.5px solid #C8A24A;border-bottom:0;border-radius:8px 8px 0 0}
.gb .ray{position:absolute;left:50%;bottom:30px;width:120px;height:110px;margin-left:-60px;background:radial-gradient(60% 100% at 50% 100%,rgba(246,227,166,.9),rgba(200,162,74,.35) 45%,transparent 72%);clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);transform-origin:50% 100%;transform:scaleY(0);opacity:0}
.burst{position:absolute;left:26px;top:14px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:0;top:0;color:#F2D58A;font-style:normal;opacity:0}
.ft{display:inline-block;font-family:Baskerville,"Baskerville Old Face",Georgia,serif;font-style:italic;font-size:clamp(28px,4.4vw,48px);line-height:1.1;color:#fff;position:relative;opacity:0;clip-path:inset(0 100% 0 0)}
.ft:after{content:"";position:absolute;inset:-10% auto -10% 0;width:28%;background:linear-gradient(100deg,transparent,rgba(255,236,180,.8),transparent);mix-blend-mode:overlay;transform:translateX(-120%) skewX(-18deg)}
.fl{display:block;height:1px;width:80px;background:#C8A24A;margin:14px 0 0 68px;transform:scaleX(0);transform-origin:left}
/* 播放（.go 由 JS 在三句完成後加上） */
.go .gb{animation:gIn .6s cubic-bezier(.3,1.5,.5,1) forwards,gShake .5s .65s ease-in-out}
.go .gb .lid{animation:lidOpen .8s 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
.go .gb .ray{animation:rayUp 2.2s 1.2s ease-out forwards}
.go .burst i{animation:fly 1.6s 1.25s cubic-bezier(.15,.7,.3,1) forwards}
.go .ft{animation:rise 1.4s 1.45s cubic-bezier(.2,.7,.2,1) forwards,glow 2.4s 2.4s ease-out forwards}
.go .ft:after{animation:sweep 1.4s 2.7s ease-in-out forwards}
.go .fl{animation:ln 1s 2.9s ease-out forwards}
@keyframes gIn{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:none}}
@keyframes gShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}
@keyframes lidOpen{to{transform:translate(-3px,-5px) rotate(-40deg)}}
@keyframes rayUp{0%{opacity:0;transform:scaleY(0)}30%{opacity:1;transform:scaleY(1)}100%{opacity:.25;transform:scaleY(1)}}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(180deg)}}
@keyframes rise{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translate(-14px,10px);filter:blur(5px)}100%{opacity:1;clip-path:inset(-20% -5% -20% 0);transform:none;filter:none}}
@keyframes glow{0%{text-shadow:none}35%{text-shadow:0 0 18px rgba(240,210,130,.85),0 0 42px rgba(200,162,74,.5)}100%{text-shadow:0 0 6px rgba(200,162,74,.25)}}
@keyframes sweep{to{transform:translateX(420%) skewX(-18deg)}}
@keyframes ln{to{transform:scaleX(1)}}
/* A 柔焦上升 */
.A .pr{animation:up 1.6s cubic-bezier(.2,.6,.2,1) both}.A .p1{animation-delay:.7s}.A .p2{animation-delay:1.8s}.A .p3{animation-delay:2.9s}
@keyframes up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* B 逐字浮現 */
.B .c{opacity:0;display:inline-block;animation:ch .7s ease-out both;white-space:pre}
@keyframes ch{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
/* C 打字效果 */
.C .en,.C .zh{white-space:pre-wrap}
.C .tc{display:inline;white-space:pre;animation:tf .45s ease-out both}@keyframes tf{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.C .cur{display:inline-block;width:1px;height:1em;background:#C8A24A;margin-left:2px;vertical-align:-.12em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(max-width:640px){.st{padding:34px 20px 38px}.pr{margin-right:16px}.zh{font-size:12px;letter-spacing:.1em}.fin{gap:12px}.gb{transform-origin:left bottom}.ft{font-size:25px}.fl{margin-left:64px}}
</style></head><body><div class="w0">
<h1>Hero 文字效果｜三款</h1>
<p class="nt">次序：Christmas Catering 2026 →「Hours to slow-cook.／慢煮數小時」→「Minutes to smoke.／煙燻數分鐘」→「One second to WOW／開箱驚喜只需一秒」→ 最後金色禮盒出現、輕輕搖動、盒蓋彈開射出金光及金粉，「Open the Box! It’s Christmas!」從盒中升起展開，再有金光一掃。按右上角「重播」。</p>
<div id="ops"></div>
</div>
<template id="tpl"><div class="st"><button class="rp">重播</button>
<div class="k">CHRISTMAS CATERING 2026</div>
<div class="l"><span class="pr p1"><span class="en">Hours to slow-cook.</span><span class="zh">慢煮數小時</span></span><span class="pr p2"><span class="en">Minutes to smoke.</span><span class="zh">煙燻數分鐘</span></span><br><span class="pr p3"><span class="en w2">One second to <b>WOW</b></span><span class="zh">開箱<b>驚喜</b>只需一秒</span></span></div>
<div class="fin"><span class="gb"><span class="ray"></span><span class="bx"></span><span class="lid"></span><span class="burst"></span></span><span class="ft">Open the Box! It&#8217;s Christmas!</span></div><span class="fl"></span>
</div></template>
<script>
var timers=[];
var OPS=[['A','柔焦上升','每句連中文由模糊向上浮出，最穩陣。'],['B','逐字浮現','一個個字輕輕升起，中文同步，有「慢煮」的節奏感。'],['C','打字效果','逐字打出，每個字柔和淡入，金色游標閃動；中文同步打出。']];
var box=document.getElementById('ops'),tpl=document.getElementById('tpl').innerHTML;
OPS.forEach(function(o){var d=document.createElement('div');d.className='op';d.innerHTML='<h2>'+o[0]+'｜'+o[1]+'</h2><p class="d">'+o[2]+'</p>'+tpl;box.appendChild(d);var st=d.querySelector('.st');st.classList.add(o[0]);st.dataset.k=o[0];
 st.dataset.html=st.innerHTML;run(st);});
function burst(st){var b=st.querySelector('.burst');b.innerHTML='';
 for(var k=0;k<18;k++){var a=-Math.PI/2+(Math.random()-.5)*2.4,r=50+Math.random()*90,e=document.createElement('i');e.textContent=k%3?'✦':'·';
  e.style.setProperty('--x',(Math.cos(a)*r*1.4).toFixed(0)+'px');e.style.setProperty('--y',(Math.sin(a)*r).toFixed(0)+'px');e.style.fontSize=(7+Math.random()*8)+'px';b.appendChild(e)}}
function chars(el,t0,step){var h=el.innerHTML,tmp=document.createElement('div');tmp.innerHTML=h;el.innerHTML='';var t=t0;
 (function walk(x0,par){[].forEach.call(x0.childNodes,function(x){if(x.nodeType===3){x.textContent.split('').forEach(function(ch){var c=document.createElement('span');c.className='c';c.textContent=ch;c.style.animationDelay=t.toFixed(2)+'s';t+=step;par.appendChild(c)})}else{var e=x.cloneNode(false);par.appendChild(e);walk(x,e)}})})(tmp,el);return t}
function type(el,t0,step,cur){var tmp=document.createElement('div');tmp.innerHTML=el.innerHTML;var segs=[];
 (function walk(x0,wrap){[].forEach.call(x0.childNodes,function(x){if(x.nodeType===3)x.textContent.split('').forEach(function(ch){segs.push([ch,wrap])});else walk(x,x.tagName)})})(tmp,null);
 el.innerHTML='';var c=document.createElement('span');c.className='cur';
 segs.forEach(function(s,i){timers.push(setTimeout(function(){var n;var ch=document.createElement('span');ch.className='tc';ch.textContent=s[0];if(s[1]){n=el.querySelector(s[1].toLowerCase()+':last-of-type');if(!n){n=document.createElement(s[1]);el.appendChild(n)}n.appendChild(ch)}else el.appendChild(ch);
   if(cur){el.appendChild(c)}},(t0+i*step)*1000))});
 if(cur)timers.push(setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c)},(t0+segs.length*step+.6)*1000));return t0+segs.length*step}
function run(st){var k=st.dataset.k,end=4.4;
 if(k==='B'||k==='C'){var t=.7;st.querySelectorAll('.pr').forEach(function(pr){var en=pr.querySelector('.en'),zh=pr.querySelector('.zh'),nE=en.textContent.length,nZ=zh.textContent.length,s=k==='B'?.045:.06;
   var e1=k==='B'?chars(en,t,s):type(en,t,s,true);var e2=k==='B'?chars(zh,t,s*nE/nZ):type(zh,t,s*nE/nZ,false);t=Math.max(e1,e2)+.45});end=t+.3}
 burst(st);timers.push(setTimeout(function(){st.classList.add('go')},end*1000))}
document.addEventListener('click',function(e){if(!e.target.classList.contains('rp'))return;timers.forEach(clearTimeout);timers=[];
 document.querySelectorAll('.st').forEach(function(st){var cls=st.className;st.innerHTML=st.dataset.html;st.className=cls.replace(' go','');run(st)})});
</script></body></html>
