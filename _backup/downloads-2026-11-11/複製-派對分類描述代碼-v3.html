ot;&gt;&lt;span&gt;查看詳情&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;&quot; href=&quot;https://aoaodelivery.com/product/ao-36-40pax-狂歡派對船河套餐-boat-party-set/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; data-pid=&quot;14314&quot; data-suffix=&quot;&quot; data-ga=&quot;qp_top_14314&quot;&gt;&lt;span class=&quot;ao-qp-ph&quot;&gt;&lt;img src=&quot;https://aoaodelivery.com/wp-content/uploads/2025/04/WhatsApp-Image-2025-04-12-at-4.08.26-PM-600x600.jpeg&quot; alt=&quot;AO 36 - 40 人狂歡派對船河套餐&quot; width=&quot;600&quot; height=&quot;600&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot;&gt;&lt;span class=&quot;ao-qp-rank&quot;&gt;TOP 5&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ao-qp-pi&quot;&gt;&lt;b&gt;AO 36 - 40 人狂歡派對船河套餐&lt;/b&gt;&lt;em&gt;Boat Party Set・碼頭交收&lt;/em&gt;&lt;span class=&quot;ao-qp-pr&quot;&gt;&lt;strong data-price&gt;HK$6,332&lt;/strong&gt;&lt;/span&gt;&lt;span class=&quot;ao-qp-btn&quot;&gt;&lt;span&gt;查看詳情&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ao-qp-nav ao-qp-next&quot; aria-label=&quot;下一個&quot;&gt;›&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ao-qp-dots&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ao-qp-help&quot;&gt;&lt;p&gt;仍未決定選擇哪一款？&lt;/p&gt;&lt;a href=&quot;https://wa.me/85269011987?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E5%B7%B2%E5%9C%A8%20Kitchen%20AO%20%E7%B6%B2%E7%AB%99%E7%80%8F%E8%A6%BD%E9%81%8E%E6%B4%BE%E5%B0%8D%E5%88%B0%E6%9C%83%E9%A4%90%E5%96%AE%EF%BC%8C%E4%BD%86%E4%BB%8D%E6%9C%AA%E6%B1%BA%E5%AE%9A%E9%81%B8%E6%93%87%E5%93%AA%E4%B8%80%E6%AC%BE%EF%BC%8C%E6%83%B3%E6%9F%A5%E8%A9%A2%E4%BB%A5%E4%B8%8B%E5%95%8F%E9%A1%8C%EF%BC%9A&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; data-ga=&quot;qp_whatsapp&quot;&gt;WhatsApp 專人為你配搭餐單&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;ao-cat-seo&quot;&gt;&lt;p&gt;Kitchen AO &lt;strong&gt;香港派對到會套餐&lt;/strong&gt;，適合生日派對、朋友聚會、公司活動及船河派對，2 人至 100 人以上均可選擇，全港送遞。想先了解每位價錢及份量？&lt;a class=&quot;ao-jump&quot; href=&quot;#aoSeo&quot;&gt;查看派對到會價錢參考 ↓&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;section class=&quot;ao-seo ao-seo-move&quot; id=&quot;aoSeo&quot;&gt;&lt;h2&gt;派對到會套餐價錢參考（按人數）&lt;/h2&gt;&lt;p&gt;派對到會的價錢主要視乎人數及套餐系列。以下為 Kitchen AO 現有派對到會套餐的價錢參考，每位價錢按套餐人數範圍計算，方便你預訂前先估算預算。&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;人數&lt;/th&gt;&lt;th&gt;推介套餐&lt;/th&gt;&lt;th&gt;套餐價&lt;/th&gt;&lt;th&gt;每位約&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 人&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/set-for-two/&quot;&gt;二人豪華儀式感套餐&lt;/a&gt;&lt;/td&gt;&lt;td&gt;HK$588&lt;/td&gt;&lt;td&gt;HK$294&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4–6 人&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/chill-box/&quot;&gt;Chill 一下野餐盒（大）&lt;/a&gt;&lt;/td&gt;&lt;td&gt;HK$628&lt;/td&gt;&lt;td&gt;HK$105–157&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;6–8 人&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/vegetarians-set/&quot;&gt;「素」味人生素食套餐&lt;/a&gt;&lt;/td&gt;&lt;td&gt;HK$1,388&lt;/td&gt;&lt;td&gt;HK$174–231&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;8–10 人&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/foot-party/&quot;&gt;美食派對 Gourmet Set&lt;/a&gt;&lt;/td&gt;&lt;td&gt;HK$1,988&lt;/td&gt;&lt;td&gt;HK$199–249&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;12–16 人&lt;/td&gt;&lt;td&gt;美食派對 Gourmet Set&lt;/td&gt;&lt;td&gt;HK$2,988&lt;/td&gt;&lt;td&gt;HK$187–249&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;18–22 人&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/refreshment-set/&quot;&gt;輕食宴會 Refreshment Set&lt;/a&gt;&lt;/td&gt;&lt;td&gt;HK$3,488&lt;/td&gt;&lt;td&gt;HK$159–194&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;26–30 人&lt;/td&gt;&lt;td&gt;美食派對 Gourmet Set&lt;/td&gt;&lt;td&gt;HK$5,188&lt;/td&gt;&lt;td&gt;HK$173–200&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;35–40 人&lt;/td&gt;&lt;td&gt;美食派對 Gourmet Set&lt;/td&gt;&lt;td&gt;HK$6,788&lt;/td&gt;&lt;td&gt;HK$170–194&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;48–54 人&lt;/td&gt;&lt;td&gt;美食派對 Gourmet Set&lt;/td&gt;&lt;td&gt;HK$9,188&lt;/td&gt;&lt;td&gt;HK$170–191&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;100 人&lt;/td&gt;&lt;td&gt;百人慶典派對到會套餐&lt;/td&gt;&lt;td&gt;HK$13,800&lt;/td&gt;&lt;td&gt;HK$138&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p class=&quot;sm&quot;&gt;價錢以網站即時顯示為準；部分菜式可升級，運費按送貨地區另計。人數越多，每位平均價錢越低。&lt;/p&gt;&lt;details class=&quot;ao-fold&quot;&gt;&lt;summary&gt;&lt;h2&gt;派對到會餐單樣本：12–16 人美食派對&lt;/h2&gt;&lt;/summary&gt;&lt;div class=&quot;ao-foldin&quot;&gt;&lt;p&gt;以人氣之選 12–16 人美食派對 Gourmet Set（HK$2,988）為例，套餐共 11 款菜式，每個類別均可自選：&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;前菜 4 款&lt;/strong&gt;（每款 16 件）：例如蜜蜜燒雞翼配脆薯角、避風塘炸海鮮豆腐、日式雞皮餃子配酥炸洋蔥圈、法式龍蝦汁燴蛋餃&lt;/li&gt;&lt;li&gt;&lt;strong&gt;沙律 2 款&lt;/strong&gt;（大盒）：例如油香煙三文魚特調凱撒沙律、千島汁大蝦蜜桃沙律&lt;/li&gt;&lt;li&gt;&lt;strong&gt;意粉及飯 2 款&lt;/strong&gt;（每款 4 磅）：例如黑松露野菌蘆筍忌廉意粉、泰國蝦頭油炸乾蔥珍珠帶子海鮮蟹籽炒飯&lt;/li&gt;&lt;li&gt;&lt;strong&gt;主菜 3 款&lt;/strong&gt;（每款 4 磅或指定份量）：例如香草蜜糖鹿兒島叉燒扒、紅酒慢燴鮮蕃茄和牛牛肋條、檸檬葉炭烤爆汁原塊豬頸肉&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;想加多款小食或升級主菜，可在下單頁面直接加配。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;ao-fold&quot;&gt;&lt;summary&gt;&lt;h2&gt;派對到會份量建議&lt;/h2&gt;&lt;/summary&gt;&lt;div class=&quot;ao-foldin&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;正餐時間（午餐、晚餐）&lt;/strong&gt;：選擇美食派對 Gourmet Set。以 12–16 人套餐為例，意粉、飯及主菜合共約 20 磅，另有 64 件前菜，足夠作一餐正餐。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;下午茶、酒會、會議茶點&lt;/strong&gt;：選擇輕食宴會 Refreshment Set，以小食及手指食物為主，方便站立進食。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;人數介乎兩個套餐之間&lt;/strong&gt;：建議選擇較大的一款，或以較細的套餐加配單品小食。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;派對超過 3 小時&lt;/strong&gt;：建議加配 1 至 2 款小食或甜品，避免後段不夠食。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;有朋友吃素&lt;/strong&gt;：可另加一個「素」味人生素食套餐，葷素分開擺放更方便。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;ao-fold&quot;&gt;&lt;summary&gt;&lt;h2&gt;按場合選擇派對到會&lt;/h2&gt;&lt;/summary&gt;&lt;div class=&quot;ao-foldin&quot;&gt;&lt;div class=&quot;ao-occ&quot;&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/children/&quot;&gt;&lt;b&gt;🎂 生日派對&lt;/b&gt;&lt;span&gt;兒童派對套餐、小朋友生日會&lt;/span&gt;&lt;/a&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/boat-party-set/&quot;&gt;&lt;b&gt;🚤 船河派對&lt;/b&gt;&lt;span&gt;碼頭交收，15–40 人船河套餐&lt;/span&gt;&lt;/a&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/vegetarians-set/&quot;&gt;&lt;b&gt;🥗 素食派對&lt;/b&gt;&lt;span&gt;「素」味人生 6–26 人&lt;/span&gt;&lt;/a&gt;&lt;a href=&quot;https://aoaodelivery.com/corporate-catering-hk/&quot;&gt;&lt;b&gt;💼 公司活動&lt;/b&gt;&lt;span&gt;公司到會、年會及團年飯&lt;/span&gt;&lt;/a&gt;&lt;a href=&quot;https://aoaodelivery.com/product-category/party/chill-box/&quot;&gt;&lt;b&gt;🧺 野餐及戶外&lt;/b&gt;&lt;span&gt;Chill 一下野餐盒&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;p class=&quot;sm&quot;&gt;延伸閱讀：&lt;a href=&quot;https://aoaodelivery.com/blog/kids-birthday-party-catering/&quot;&gt;小朋友生日會到會挑選指南&lt;/a&gt;｜&lt;a href=&quot;https://aoaodelivery.com/blog/boat-party-catering-guide/&quot;&gt;船P必備清單 2026&lt;/a&gt;｜&lt;a href=&quot;https://aoaodelivery.com/blog/vegetarian-catering-hong-kong/&quot;&gt;素食到會揀選全攻略&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;ao-fold ao-faqlist&quot;&gt;&lt;summary&gt;&lt;h2&gt;派對到會常見問題&lt;/h2&gt;&lt;/summary&gt;&lt;div class=&quot;ao-foldin&quot;&gt;&lt;details&gt;&lt;summary&gt;派對到會幾錢一位？&lt;/summary&gt;&lt;p&gt;Kitchen AO 派對到會套餐每位約 HK$140 至 HK$250，視乎人數及套餐系列；人數越多，每位平均價錢越低。二人套餐則為 HK$588。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;最少幾多人可以訂派對到會？&lt;/summary&gt;&lt;p&gt;二人套餐 2 人起；野餐盒 4 人起；派對到會套餐由 6–8 人起，最多可安排 100 人以上的活動。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;派對到會要幾日前預訂？&lt;/summary&gt;&lt;p&gt;建議最少提前 3 至 5 個工作天預訂；週末、節日及 12 月旺季宜提前約兩星期。如需即日到會，請先完成下單，再透過 WhatsApp 聯絡客服，我們會視乎當日情況盡力安排。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;到會運費幾錢？可以免運費嗎？&lt;/summary&gt;&lt;p&gt;運費按送貨地區計算，九龍區由 HK$70 起、新界由 HK$60 起、港島由 HK$180 起。單一訂單滿 HK$700，九龍指定區域免運費，港島及新界運費半價；滿 HK$1,450 即享全港免運費（不派送地區除外）。詳情可參閱&lt;a href=&quot;https://aoaodelivery.com/delivery/&quot;&gt;送貨需知&lt;/a&gt;。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;套餐菜式可以自選嗎？&lt;/summary&gt;&lt;p&gt;可以。美食派對及輕食宴會套餐的前菜、沙律、意粉及主菜均可在每個類別內自選，部分菜式可加錢升級。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;有冇素食或走五辛選擇？&lt;/summary&gt;&lt;p&gt;有。「素」味人生素食套餐適合 6 至 26 人；如需走五辛或有其他飲食要求，可在下單時備註或 WhatsApp 客服配搭。&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;
</textarea></body></html>
