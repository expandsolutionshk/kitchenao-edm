<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙 11 KV：三張主圖排法方案</title><style>body{margin:0;background:#EDEAE4;font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;color:#3A342B}.w{max-width:640px;margin:0 auto;padding:24px 16px 60px}h1{font-size:20px;margin:0 0 6px}.n{font-size:14px;line-height:1.8;color:#5d534d;margin:0 0 20px}section{margin:0 0 44px}h2{font-size:16px;margin:0 0 6px}h2 em{font-style:normal;color:#9A7B2E;margin-right:6px}p{font-size:14px;line-height:1.8;margin:0 0 12px}img{display:block;width:100%;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}</style></head><body><div class="w"><h1>雙 11 KV：三張主圖排法方案</h1><p class="n">三張主圖：煲仔飯、精緻餐盒、自助餐擺枱（新加）。其他內容不變，只改主圖排法。設計參考 Four Seasons Sydney 的留白及層次。</p><section><h2><em>方案 A</em>三聯直幅</h2><p>三張直身相並排，中間煲仔飯最大最高，兩邊餐盒及自助餐對稱。整齊、平衡，最似 Four Seasons 的 tile 排法。</p><img src="img/kv-hero-A.jpg" alt="方案 A"></section><section><h2><em>方案 B</em>編輯式拼貼</h2><p>左邊煲仔飯大圖，右邊餐盒及自助餐上下兩格，全部直角對齊、不打斜。最雜誌感、最高級，亦最清楚展示三款場景。</p><img src="img/kv-hero-B.jpg" alt="方案 B"></section><section><h2><em>方案 C</em>扇形疊卡</h2><p>兩邊相片打斜放後，中間煲仔飯放最前，似一疊相片攤開。最有層次及節日感，但兩邊相片只見大半。</p><img src="img/kv-hero-C.jpg" alt="方案 C"></section></div></body></html>
