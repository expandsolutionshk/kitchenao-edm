<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><title>派對分類｜複製代碼 v2</title><style>body{font:15px/1.6 -apple-system,"PingFang HK",sans-serif;margin:24px;background:#FBF7EE;color:#222;max-width:1000px}button{font:700 17px/1 inherit;background:#1A1A1A;color:#F7CE46;border:0;border-radius:30px;padding:12px 26px;cursor:pointer}textarea{width:100%;height:28vh;margin:12px 0 30px;font:12px/1.4 Menlo,monospace;border:1px solid #ccc;border-radius:8px;padding:10px}.ok{margin-left:12px;color:#2C6E49;font-weight:700}h2{margin:20px 0 4px}</style></head><body><h1>派對到會套餐分類｜WAF 安全版</h1><p>先用 GitHub Desktop push，再做以下兩步。</p><h2>步驟 A｜加入「附加 CSS」</h2><p>外觀 → 自訂 → 附加 CSS → 拉到最底，喺現有內容<b>後面</b>貼上（唔好刪舊 CSS）→ 發佈</p><button data-t="t1">複製</button><span class="ok" id="ok1"></span><textarea id="t1" readonly>/* Kitchen AO - party category quick-pick (server-rendered) */
.ao-qp{max-width:1180px;margin:16px auto 32px;padding:40px 36px 34px;border-radius:24px;background:radial-gradient(120% 140% at 0% 0%,#3a2a20 0%,#211812 55%,#15100c 100%);color:#efe5d6;box-shadow:inset 0 0 0 1px rgba(214,180,104,.25);font-family:inherit;} .ao-qp *{box-sizing:border-box;font-family:inherit;} .ao-qp a{text-decoration:none !important;} .ao-qp-head{text-align:center;margin:0 0 28px;} .ao-qp-eyebrow{text-align:center !important;margin:0 0 8px !important;color:#c9a45c;font-size:11px;font-weight:700;letter-spacing:2px;line-height:1.3;text-transform:uppercase;} .ao-qp .ao-qp-title{margin:0 0 6px !important;color:#f8f1e7 !important;font-size:28px;font-weight:800;line-height:1.35;letter-spacing:1px;} .ao-qp-sub{text-align:center !important;margin:0 !important;color:#cbbca6;font-size:15px;line-height:1.7;} .ao-qp-sec{margin:0 0 28px;} .ao-qp-lbl{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:#e3c98f;font-size:16px;font-weight:800;letter-spacing:.5px;} .ao-qp-lbl span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#d6b468;color:#241a12;font-size:13px;font-weight:800;} .ao-qp-lbl::after{content:&quot;&quot;;flex:1;height:1px;background:linear-gradient(90deg,rgba(214,180,104,.5),rgba(214,180,104,0));} /* ===== 本週 TOP 5：大字 + 金色標籤 + 疊層卡 ===== */ .ao-qp-sec--top{position:relative;margin-top:44px;padding:34px 20px 22px;border-radius:20px;background:linear-gradient(180deg,rgba(214,180,104,.14) 0%,rgba(214,180,104,.04) 100%);border:1px solid rgba(214,180,104,.35);box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 6px rgba(214,180,104,.06);} .ao-qp-tophead{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;} .ao-qp-toptag{display:inline-flex;align-items:center;gap:6px;padding:10px 26px;border-radius:999px;background:linear-gradient(135deg,#f0d39a 0%,#d2a44e 100%);color:#241a12;font-size:21px;font-weight:800;letter-spacing:1px;line-height:1.2;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 4px #211812,0 0 0 5px rgba(214,180,104,.6);} .ao-qp-toptag i{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:2px;border-radius:50%;background:#241a12;color:#f0d39a;font-style:normal;font-size:13px;} .ao-qp-toptag b{padding:2px 9px;border-radius:8px;background:#241a12;color:#f0d39a;font-weight:800;} .ao-qp-pop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:6px;} .ao-qp-pop a{position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid #fff;background:#fff;color:#2b211b !important;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .25s ease,border-color .25s ease;} @media (hover:hover){.ao-qp-pop a:hover{transform:translateY(-4px);border-color:#c9a45c;}} .ao-qp-ph{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;} .ao-qp-ph img{display:block;width:100% !important;height:100% !important;object-fit:cover;transition:transform .5s ease;} .ao-qp-pop a:hover .ao-qp-ph img{transform:scale(1.05);} .ao-qp-rank{position:absolute;left:10px;top:10px;padding:5px 11px;border-radius:8px;background:#ffd23f;color:#1d150f;font-size:12.5px;font-weight:900;letter-spacing:1px;box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 0 2px #1d150f;} .ao-qp-pi{display:flex;flex-direction:column;flex:1;padding:12px 12px 14px;} .ao-qp-pi b{font-size:14.5px;font-weight:700;line-height:1.45;} .ao-qp-pi em{margin-top:3px;font-style:normal;font-size:12px;color:#8a7b6e;line-height:1.5;} .ao-qp-pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:auto;padding-top:10px;} .ao-qp-pr strong{font-size:18px;font-weight:800;color:#9a6b1f;} .ao-qp-pr del{font-size:12px;color:#a39686;} .ao-qp-btn{display:block;margin-top:10px;padding:9px 10px;border-radius:999px;background:linear-gradient(135deg,#e3c482,#b8893f);color:#1d150f;font-size:13.5px;font-weight:800;text-align:center;line-height:1.2;transition:filter .2s ease;} .ao-qp-pop a:hover .ao-qp-btn{filter:brightness(1.1);} /* Halloween 卡（跟 Pop up 紫橙色調） */ .ao-qp-pop a.is-hw{background:linear-gradient(180deg,#2c1f3b 0%,#1c1426 100%);border-color:#ff7a1a;color:#f6eddf !important;box-shadow:0 10px 26px rgba(255,90,0,.25);} .ao-qp-pop a.is-hw em{color:#cdb8e6;} .ao-qp-pop a.is-hw .ao-qp-pr strong{color:#ffb347;} .ao-qp-pop a.is-hw .ao-qp-pr del{color:#9c8bb3;} .ao-qp-pop a.is-hw .ao-qp-btn{background:linear-gradient(135deg,#ff8a1f,#ff5a00);color:#1c1426;} /* ===== 1・2 區塊：同 TOP 5 一樣疊層標籤，但用唔同顏色 ===== */ .ao-qp-box{position:relative;margin-top:44px;padding:34px 20px 22px;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.3);} .ao-qp-tag{display:inline-flex;align-items:center;gap:6px;padding:10px 26px;border-radius:999px;font-size:19px;font-weight:800;letter-spacing:1px;line-height:1.2;} .ao-qp-tag i{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:2px;border-radius:50%;font-style:normal;font-size:13px;} /* 1 按人數：象牙白 */ .ao-qp-box--ppl{background:linear-gradient(180deg,rgba(246,237,223,.10) 0%,rgba(246,237,223,.03) 100%);border:1px solid rgba(246,237,223,.35);} .ao-qp-tag--ppl{background:linear-gradient(135deg,#fffaf1 0%,#eadcc4 100%);color:#2b211b;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 4px #211812,0 0 0 5px rgba(246,237,223,.55);} .ao-qp-tag--ppl i{background:#2b211b;color:#f6eddf;} /* 2 按系列：玫瑰銅 */ .ao-qp-box--ser{background:linear-gradient(180deg,rgba(196,120,84,.14) 0%,rgba(196,120,84,.04) 100%);border:1px solid rgba(214,140,104,.45);} .ao-qp-tag--ser{background:linear-gradient(135deg,#e6a37f 0%,#a95c3b 100%);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 4px #211812,0 0 0 5px rgba(214,140,104,.6);} .ao-qp-tag--ser i{background:#fff;color:#8f4a2d;} /* ===== 按人數（白卡） ===== */ .ao-qp-ppl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;} .ao-qp-ppl a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:84px;padding:12px 6px;border:1.5px solid #fff;border-radius:16px;background:linear-gradient(180deg,#ffffff 0%,#f8f2e8 100%);color:#2b211b !important;text-align:center;line-height:1.2;box-shadow:0 6px 16px rgba(0,0,0,.28);transition:all .25s ease;} .ao-qp-ppl b{display:flex;align-items:baseline;gap:4px;font-size:22px;font-weight:800;white-space:nowrap;color:#2b211b;letter-spacing:.3px;} .ao-qp-ppl small{font-size:13px;font-weight:700;color:#9a7230;} .ao-qp-ppl em{display:inline-block;padding:3px 10px;border-radius:999px;background:#f1e6d2;font-style:normal;font-size:11.5px;font-weight:600;color:#7d5b27;white-space:nowrap;} .ao-qp-ppl a:hover,.ao-qp-ppl a:focus-visible{border-color:#d6b468;transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.35),0 0 0 3px rgba(214,180,104,.35);} .ao-qp-ppl a:hover em{background:#2b211b;color:#f0d39a;} /* ===== 按系列 ===== */ .ao-qp-series{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;} .ao-qp-series a{position:relative;display:flex;text-align:left;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;border:1px solid rgba(214,180,104,.2);background:rgba(255,255,255,.035);color:#f6eddf !important;transition:all .25s ease;} .ao-qp-series a:hover{border-color:#c9a45c;background:rgba(201,164,92,.1);} .ao-qp-series i{flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(214,180,104,.16);font-style:normal;font-size:19px;} .ao-qp-series a &gt; span:not(.ao-qp-bats){display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;} .ao-qp-l2{display:inline;} .ao-qp-series b{font-size:15px;font-weight:800;line-height:1.35;} .ao-qp-series small{margin-top:2px;font-size:12.5px;color:#a99880;line-height:1.4;} .ao-qp-series em{margin-left:auto;flex:0 0 auto;padding:3px 10px;border-radius:999px;font-style:normal;font-size:11px;font-weight:800;white-space:nowrap;} /* 美食派對：金色 highlight */ .ao-qp-series a.is-hot{background:linear-gradient(135deg,#f0d39a 0%,#d2a44e 100%);border-color:transparent;color:#241a12 !important;} .ao-qp-series a.is-hot small{color:#5a4320;} .ao-qp-series a.is-hot i{background:rgba(255,255,255,.45);} .ao-qp-series a.is-hot em{background:#c0392b;color:#fff;} .ao-qp-series a.is-hot:hover{filter:brightness(1.05);} /* Halloween：跟 Pop up 紫橙色調 */ .ao-qp-series a.is-hw{background:linear-gradient(135deg,#2c1f3b 0%,#1c1426 100%);border:1.5px solid #ff7a1a;box-shadow:0 6px 18px rgba(255,90,0,.22);} .ao-qp-series a.is-hw b{color:#fff;} .ao-qp-series a.is-hw small{color:#cdb8e6;} .ao-qp-series a.is-hw i{background:rgba(255,122,26,.18);} .ao-qp-series a.is-hw b{font-size:16px;} .ao-qp-series a.is-hw em{padding:6px 14px;font-size:13.5px;letter-spacing:1px;background:linear-gradient(135deg,#ffb347,#ff5a00);color:#1c1426;box-shadow:0 0 0 2px rgba(255,179,71,.35),0 4px 14px rgba(255,90,0,.55);animation:aoQpGlow 1.8s ease-in-out infinite;} .ao-qp-limit{align-self:flex-start;display:inline-block;margin:0 0 5px;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,#ffd23f 0%,#ff8a1f 55%,#ff5a00 100%);color:#1c1426;font-size:12.5px;font-weight:900;letter-spacing:1.5px;line-height:1.3;box-shadow:0 0 0 2px rgba(255,179,71,.35),0 4px 14px rgba(255,90,0,.55);animation:aoQpGlow 1.8s ease-in-out infinite;} @keyframes aoQpGlow{0%,100%{box-shadow:0 0 0 2px rgba(255,179,71,.35),0 4px 14px rgba(255,90,0,.45);}50%{box-shadow:0 0 0 4px rgba(255,179,71,.55),0 4px 22px rgba(255,90,0,.85);}} .ao-qp-series a.is-hw:hover{background:linear-gradient(135deg,#3a2850 0%,#22182e 100%);} /* ===== Halloween 蝙蝠動畫（同 Pop up） ===== */ .ao-qp-bats{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:inherit;pointer-events:none;} .ao-qp-bats i{position:absolute;top:50%;left:-12%;width:30px;margin-top:-7px;animation:aoQpBat 5s linear infinite;} .ao-qp-bats i.b2{width:22px;margin-top:-14px;animation-duration:6s;animation-delay:1.6s;} .ao-qp-bats i.b3{width:26px;margin-top:1px;animation-duration:5.5s;animation-delay:3.2s;} .ao-qp-bats svg{display:block;width:100%;height:auto;transform-origin:50% 40%;animation:aoQpFlap .16s ease-in-out infinite alternate;} .ao-qp-series a.is-hw .ao-qp-bats svg path{fill:#ff8a1f;} .ao-qp-series a.is-hw .ao-qp-bats i{width:34px;} .ao-qp-series a.is-hw .ao-qp-bats i.b2{width:26px;} .ao-qp-series a.is-hw .ao-qp-bats i.b3{width:30px;} .ao-qp-series a.is-hw &gt; i,.ao-qp-series a.is-hw &gt; span{position:relative;z-index:1;} .ao-qp-series a.is-hw &gt; em{z-index:2;} .ao-qp-btn{position:relative;overflow:hidden;} .ao-qp-btn &gt; span{position:relative;z-index:1;} .ao-qp-pop a.is-hw .ao-qp-btn::after{content:&quot;&quot;;position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));transform:skewX(-20deg);animation:aoQpShine 2.8s ease-in-out infinite;z-index:2;} @keyframes aoQpBat{0%{left:-12%;transform:translateY(4px);}25%{transform:translateY(-6px);}50%{transform:translateY(5px);}75%{transform:translateY(-5px);}100%{left:108%;transform:translateY(3px);}} @keyframes aoQpFlap{from{transform:scaleY(1);}to{transform:scaleY(.55) scaleX(.92);}} @keyframes aoQpShine{0%{left:-60%;}55%,100%{left:130%;}} /* ===== WhatsApp ===== */ .ao-qp-help{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 18px;padding-top:22px;border-top:1px solid rgba(214,180,104,.22);} .ao-qp-help p{margin:0 !important;font-size:15px;color:#cbbca6;} .ao-qp-help a{display:inline-block;padding:13px 28px;border-radius:999px;background:linear-gradient(135deg,#e3c482,#b8893f);color:#1d150f !important;font-size:15px;font-weight:800;line-height:1.2;} .ao-qp-help a:hover{filter:brightness(1.08);} .ao-qp img.emoji{display:inline !important;width:1em !important;height:1em !important;margin:0 !important;vertical-align:-0.12em !important;} .ao-qp-slider{position:relative;} .ao-qp-nav{display:none;} .ao-qp-dots{display:none;} /* ≤1080px：TOP 5 變成可左右滑動 */ @media (max-width:1080px){ .ao-qp-pop{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;padding:6px 2px 10px;scrollbar-width:none;} .ao-qp-pop::-webkit-scrollbar{display:none;} .ao-qp-pop a{flex:0 0 31%;scroll-snap-align:start;} .ao-qp-nav{position:absolute;top:38%;z-index:5;display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:rgba(255,210,63,.95);color:#1d150f;font:inherit;font-size:24px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.4);transition:opacity .2s ease;} .ao-qp-prev{left:-8px;} .ao-qp-next{right:-8px;} .ao-qp-nav[disabled]{opacity:0;pointer-events:none;} .ao-qp-dots{display:flex;justify-content:center;gap:6px;margin-top:6px;} .ao-qp-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s ease;} .ao-qp-dots i.on{width:20px;border-radius:4px;background:#ffd23f;} } @media (max-width:960px){.ao-qp-ppl{grid-template-columns:repeat(3,minmax(0,1fr));} .ao-qp-series a.is-hot em{position:absolute;top:-10px;right:8px;margin:0;} .ao-qp-series a.is-hw b{font-size:15px;} } @media (max-width:640px){ .ao-qp{padding:26px 14px 22px;border-radius:18px;} .ao-qp .ao-qp-title{font-size:23px;} .ao-qp-sub{font-size:14px;} .ao-qp-sec{margin-bottom:24px;} .ao-qp-sec--top{margin-top:36px;padding:30px 0 14px 12px;border-radius:16px;} .ao-qp-toptag,.ao-qp-tag{font-size:16px;padding:8px 16px;} .ao-qp-box{margin-top:36px;padding:30px 10px 14px;border-radius:16px;} .ao-qp-pop{gap:10px;padding:6px 2px 10px;} .ao-qp-pop a{flex:0 0 66%;} .ao-qp-nav{width:34px;height:34px;font-size:22px;} .ao-qp-prev{left:-6px;} .ao-qp-next{right:-2px;} .ao-qp-ppl{gap:8px;} .ao-qp-ppl a{min-height:70px;padding:9px 3px;gap:5px;border-radius:12px;} .ao-qp-ppl em{padding:2px 7px;} .ao-qp-ppl b{font-size:17px;} .ao-qp-ppl em{font-size:11px;} .ao-qp-series{gap:8p
