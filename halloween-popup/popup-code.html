<script>
(function () {
  var overlay = document.getElementById('ao-popup-overlay');
  var box = document.getElementById('ao-popup-box');
  var closeBtn = document.getElementById('ao-popup-close');
  if (!overlay || !box || !closeBtn) return;

  document.body.appendChild(overlay);

  // ===== Frequency cap：每日最多 3 次（每日 reset）=====
  var KEY = 'ao_popup_halloween26';
  var d = new Date();
  var today = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  var data = { date: '', count: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) {}
  if (data.date !== today) { data = { date: today, count: 0 }; }
  if (data.count >= 3) return;

  function openPopup() {
    overlay.style.display = 'flex';
    data.count = (data.count || 0) + 1;
    data.date = today;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function closePopup() { overlay.style.display = 'none'; }
  setTimeout(openPopup, 800);
  closeBtn.addEventListener('click', function (e) { e.preventDefault(); closePopup(); });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) { closePopup(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePopup(); } });
})();
</script>
