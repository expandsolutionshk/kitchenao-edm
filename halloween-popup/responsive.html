&lt;script&gt;
(function () {
  var overlay = document.getElementById(&#x27;ao-popup-overlay&#x27;);
  var box = document.getElementById(&#x27;ao-popup-box&#x27;);
  var closeBtn = document.getElementById(&#x27;ao-popup-close&#x27;);
  if (!overlay || !box || !closeBtn) return;

  document.body.appendChild(overlay);

  // ===== Frequency cap：每日最多 3 次（每日 reset）=====
  var KEY = &#x27;ao_popup_halloween26&#x27;;
  var d = new Date();
  var today = d.getFullYear() + &#x27;-&#x27; + (d.getMonth() + 1) + &#x27;-&#x27; + d.getDate();
  var data = { date: &#x27;&#x27;, count: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) {}
  if (data.date !== today) { data = { date: today, count: 0 }; }
  if (data.count &gt;= 3) return;

  function openPopup() {
    overlay.style.display = &#x27;flex&#x27;;
    data.count = (data.count || 0) + 1;
    data.date = today;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function closePopup() { overlay.style.display = &#x27;none&#x27;; }
  setTimeout(openPopup, 800);
  closeBtn.addEventListener(&#x27;click&#x27;, function (e) { e.preventDefault(); closePopup(); });
  overlay.addEventListener(&#x27;click&#x27;, function (e) { if (e.target === overlay) { closePopup(); } });
  document.addEventListener(&#x27;keydown&#x27;, function (e) { if (e.key === &#x27;Escape&#x27;) { closePopup(); } });
})();
&lt;/script&gt;

&lt;script&gt;
(function () {
  var overlay = document.getElementById(&#x27;ao-popup-overlay&#x27;);
  var box = document.getElementById(&#x27;ao-popup-box&#x27;);
  var closeBtn = document.getElementById(&#x27;ao-popup-close&#x27;);
  if (!overlay || !box || !closeBtn) return;

  document.body.appendChild(overlay);

  // ===== Frequency cap：每日最多 3 次（每日 reset）=====
  var KEY = &#x27;ao_popup_halloween26&#x27;;
  var d = new Date();
  var today = d.getFullYear() + &#x27;-&#x27; + (d.getMonth() + 1) + &#x27;-&#x27; + d.getDate();
  var data = { date: &#x27;&#x27;, count: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) {}
  if (data.date !== today) { data = { date: today, count: 0 }; }
  if (data.count &gt;= 3) return;

  function openPopup() {
    overlay.style.display = &#x27;flex&#x27;;
    data.count = (data.count || 0) + 1;
    data.date = today;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function closePopup() { overlay.style.display = &#x27;none&#x27;; }
  setTimeout(openPopup, 800);
  closeBtn.addEventListener(&#x27;click&#x27;, function (e) { e.preventDefault(); closePopup(); });
  overlay.addEventListener(&#x27;click&#x27;, function (e) { if (e.target === overlay) { closePopup(); } });
  document.addEventListener(&#x27;keydown&#x27;, function (e) { if (e.key === &#x27;Escape&#x27;) { closePopup(); } });
})();

&lt;script&gt;
(function () {
  var overlay = document.getElementById(&#x27;ao-popup-overlay&#x27;);
  var box = document.getElementById(&#x27;ao-popup-box&#x27;);
  var closeBtn = document.getElementById(&#x27;ao-popup-close&#x27;);
  if (!overlay || !box || !closeBtn) return;

  document.body.appendChild(overlay);

  // ===== Frequency cap：每日最多 3 次（每日 reset）=====
  var KEY = &#x27;ao_popup_halloween26&#x27;;
  var d = new Date();
  var today = d.getFullYear() + &#x27;-&#x27; + (d.getMonth() + 1) + &#x27;-&#x27; + d.getDate();
  var data = { date: &#x27;&#x27;, count: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) {}
  if (data.date !== today) { data = { date: today, count: 0 }; }
  if (data.count &gt;= 3) return;

  function openPopup() {
    overlay.style.display = &#x27;flex&#x27;;
    data.count = (data.count || 0) + 1;
    data.date = today;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function closePopup() { overlay.style.display = &#x27;none&#x27;; }
  setTimeout(openPopup, 800);
  closeBtn.addEventListener(&#x27;click&#x27;, function (e) { e.preventDefault(); closePopup(); });
  overlay.addEventListener(&#x27;click&#x27;, function (e) { if (e.target === overlay) { closePopup(); } });
  document.addEventListener(&#x27;keydown&#x27;, function (e) { if (e.key === &#x27;Escape&#x27;) { closePopup(); } });
})();
&lt;/script&gt;
