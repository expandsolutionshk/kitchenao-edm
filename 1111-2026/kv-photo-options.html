<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙 11 KV：三張主圖 Option</title><style>body{margin:0;background:#EDEAE4;font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;color:#3A342B}.w{max-width:680px;margin:0 auto;padding:24px 14px 60px}h1{font-size:20px;margin:0 0 6px}.n{font-size:14px;line-height:1.8;color:#5d534d;margin:0 0 22px}section{margin:0 0 44px}h2{font-size:16px;margin:0 0 6px}h2 em{font-style:normal;color:#9A7B2E;margin-right:6px}.d{font-size:14px;line-height:1.8;margin:0 0 12px}.mock{border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}.mock img{display:block;width:100%}</style></head><body><div class="w"><h1>雙 11 KV：三張主圖排法 Option</h1><p class="n">只改三張主圖排法，其他內容不變。設計參考 Four Seasons Sydney 的留白及層次。</p><section><h2><em>現時</em>內縮全景＋中間凸出（C2）</h2><p class="d">對照用。</p><div class="mock"><img src="img/kv-c2-np.jpg" alt="現時"></div></section><section><h2><em>Option 1</em>三張等大</h2><p class="d">三張相同一大小，平均分佈，間距一致，冇框，只有圓角同柔和陰影。最整齊、最簡約。</p><div class="mock"><img src="img/kv-p1.jpg" alt="Option 1"></div></section><section><h2><em>Option 2</em>扇形疊放</h2><p class="d">中間煲仔飯最大、放最前；兩邊細少少，向外打斜，放喺後面，全部有白框加金幼線。最有層次。</p><div class="mock"><img src="img/kv-p2.jpg" alt="Option 2"></div></section><section><h2><em>Option 3</em>拼貼</h2><p class="d">中間煲仔飯做大橫圖；餐盒細圖疊喺左下角，自助餐細圖疊喺右上角，輕微打斜。最有雜誌感，主角最突出。</p><div class="mock"><img src="img/kv-p3.jpg" alt="Option 3"></div></section></div></body></html>
