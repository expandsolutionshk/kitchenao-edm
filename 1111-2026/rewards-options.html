<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙 11 四重賞卡：2 個 Option</title><style>body{margin:0;background:#EDEAE4;font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;color:#3A342B}.w{max-width:680px;margin:0 auto;padding:24px 14px 60px}h1{font-size:20px;margin:0 0 6px}.n{font-size:14px;line-height:1.8;color:#5d534d;margin:0 0 22px}section{margin:0 0 44px}h2{font-size:16px;margin:0 0 6px}h2 em{font-style:normal;color:#9A7B2E;margin-right:6px}.d{font-size:14px;line-height:1.8;margin:0 0 12px}img{display:block;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.12)}</style></head><body><div class="w"><h1>雙 11 四重賞卡：圓章＋第幾賞合併，2 個 Option</h1><p class="n">兩個 option 都將「滿 $X」同「第 X 賞」合併成一個元素，卡片變短。設計參考 Four Seasons Sydney。</p><section><h2><em>Option A</em>合併膠囊</h2><p class="d">「第一賞｜滿 $1,100」合併成一粒黑金膠囊，一半凸出卡頂，中間金色直線分隔。保留原本「掛牌」感覺，卡片短咗大約 100px。</p><img src="img/rewards-A.jpg" alt="Option A"></section><section><h2><em>Option B</em>卡頂標題條</h2><p class="d">卡片頂部變成黑色標題條：左邊金字「第一賞」，右邊白字「滿 $1,100」，下面金幼線。似酒店餐牌標題，最整齊，卡片亦短咗。</p><img src="img/rewards-B.jpg" alt="Option B"></section></div></body></html>
